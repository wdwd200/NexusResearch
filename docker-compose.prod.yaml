# NexusResearch 生产部署编排（4C4G3M 云服务器）
#
# 容器 memory limit 合计 1432M（MySQL 600M + Qdrant 256M + API 512M + Nginx 64M）。
# 这是上限，不是已验证的常驻内存，也不保证整机控制在 1GB。
# 使用前把 .env.example 复制为 .env 并填入真实密钥，
# 前端先在本机或构建机执行 `pnpm build`，nginx 直接挂载 frontend/dist。
#
# 启动：docker compose -f docker-compose.prod.yaml up -d --build

name: nexusresearch

services:
  mysql:
    image: mysql:8.0
    container_name: nexus-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nexus_research_db}
      MYSQL_USER: ${MYSQL_USER:-nexus_admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --sql-mode=TRADITIONAL
      # 4C4G 关键参数：压缩 buffer pool 与连接数，把常驻内存压到 450MB 以内
      - --innodb-buffer-pool-size=128M
      - --max-connections=50
      - --performance-schema=OFF
      - --innodb-log-file-size=64M
    volumes:
      - nexus_mysql_data:/var/lib/mysql
      - ./docker/mysql/mysql.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    # 只暴露给 compose 内网，不占用公网端口
    expose:
      - "3306"
    deploy:
      resources:
        limits:
          memory: 600M
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  qdrant:
    image: qdrant/qdrant:v1.16
    container_name: nexus-qdrant
    restart: unless-stopped
    volumes:
      - nexus_qdrant_data:/qdrant/storage
    expose:
      - "6333"
    deploy:
      resources:
        limits:
          memory: 256M
    # 不配置 healthcheck：qdrant/qdrant:v1.16 镜像内没有 bash/curl/wget，
    # 任何基于 shell 或 /dev/tcp 的探测都会永远失败，导致 api 无法启动。
    # 就绪判断交给 api 自身的重试与 /api/health。

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      QDRANT_URL: http://qdrant:6333
      CHECKPOINT_DB_PATH: /app/data/checkpoints.sqlite
    volumes:
      # 会话产物、上传附件、状态账本都放在宿主机，容器重建不丢数据
      - nexus_output:/app/output
      - nexus_updated:/app/updated
      - nexus_data:/app/data
    expose:
      - "8002"
    depends_on:
      mysql:
        condition: service_healthy
      # qdrant 无健康检查，只能等容器启动；知识库未就绪时工具层返回可读提示
      qdrant:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8002/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    image: nginx:alpine
    container_name: nexus-web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 直接挂载实际构建产物，避免 deploy/web 空目录被当成已上线前端
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  nexus_mysql_data:
  nexus_qdrant_data:
  nexus_output:
  nexus_updated:
  nexus_data:
